<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | Gates of Olympus</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root{--bg:#1a1a2e;--card:#16213e;--inp:#0f3460;--ac:#e94560;--ac2:#c23152;--g:#ffd700;--t:#fff;--t2:#aaa;--b:#0f3460}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;line-height:1.6}
        .lw{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
        .lc{width:100%;max-width:380px;background:var(--card);padding:35px;border-radius:14px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
        .lc h2{margin-bottom:20px;color:var(--ac);font-size:1.4em}
        .lc input{width:100%;padding:13px;margin:8px 0;border:2px solid var(--inp);background:var(--inp);color:var(--t);border-radius:8px;font-size:1em}
        .lc input:focus{outline:none;border-color:var(--ac)}
        .lc button{width:100%;padding:13px;background:var(--ac);color:var(--t);border:none;border-radius:8px;font-size:1.05em;cursor:pointer;margin-top:8px;font-weight:700}
        .lc button:hover{background:var(--ac2)}
        .err{color:var(--ac);margin-top:8px;display:none;font-weight:700}
        .ap{display:none;max-width:1300px;margin:0 auto;padding:16px}
        .ah{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:var(--card);padding:18px 20px;border-radius:12px;margin-bottom:16px}
        .ah h1{font-size:1.3em}.ah button{background:var(--ac);color:var(--t);border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-weight:700}
        .ah button:hover{background:var(--ac2)}
        .sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}
        .sc{background:var(--card);padding:18px;border-radius:12px;text-align:center}
        .sc h3{color:var(--t2);font-size:.8em;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
        .sc .v{font-size:2em;font-weight:700;color:var(--ac)}
        .le{background:var(--card);padding:22px;border-radius:12px;margin:16px 0}
        .le h2{margin-bottom:18px;color:var(--ac)}
        .le label{display:block;margin:12px 0 4px;font-weight:700;font-size:.9em}
        .le input{width:100%;padding:11px;margin-bottom:4px;background:var(--inp);border:2px solid var(--inp);color:var(--t);border-radius:8px;font-size:.9em}
        .le input:focus{outline:none;border-color:var(--ac)}
        .le .br{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
        .le button{background:var(--ac);color:var(--t);border:none;padding:11px 20px;border-radius:8px;cursor:pointer;font-weight:700}
        .le button:hover{background:var(--ac2)}.le button.rst{background:transparent;border:2px solid var(--ac)}.le button.rst:hover{background:var(--ac)}
        .ss{margin-top:10px;font-weight:700;min-height:22px}
        .st{font-size:1.3em;margin:25px 0 12px;color:var(--ac)}
        .vt{width:100%;background:var(--card);border-radius:12px;overflow-x:auto;margin:16px 0}
        .vt table{width:100%;border-collapse:collapse;min-width:850px}
        .vt th{background:var(--inp);padding:12px 10px;text-align:left;font-size:.8em;white-space:nowrap}
        .vt td{padding:10px;border-bottom:1px solid var(--b);font-size:.8em;white-space:nowrap}
        .vt tr:hover{background:rgba(233,69,96,.08)}.vt .er td{text-align:center;padding:22px;color:var(--t2)}
        @media(max-width:768px){.ap{padding:8px}.ah{flex-direction:column;text-align:center}.sg{grid-template-columns:repeat(2,1fr);gap:8px}.sc .v{font-size:1.5em}.le .br button{flex:1 1 100%}}
        @media(max-width:480px){.lc{padding:22px}.sg{grid-template-columns:1fr}.ah h1{font-size:1.1em}}
    </style>
</head>
<body>
<div class="lw" id="lf"><div class="lc"><h2>🔐 Админ-панель</h2><input type="password" id="pi" placeholder="Введите пароль" autocomplete="off"><button onclick="L()">Войти</button><div class="err" id="em">❌ Неверный пароль!</div></div></div>
<div class="ap" id="ap">
    <div class="ah"><h1>📊 Gates of Olympus — Статистика</h1><button onclick="O()">🚪 Выйти</button></div>
    <div class="sg"><div class="sc"><h3>👥 Всего</h3><div class="v" id="tv">0</div></div><div class="sc"><h3>📅 Сегодня</h3><div class="v" id="tdv">0</div></div><div class="sc"><h3>⏱️ Среднее время</h3><div class="v" id="at">0 сек</div></div><div class="sc"><h3>🌍 Стран</h3><div class="v" id="uc">0</div></div><div class="sc"><h3>📱 Мобильных</h3><div class="v" id="mp">0%</div></div><div class="sc"><h3>💻 Десктоп</h3><div class="v" id="dp">0%</div></div></div>
    <div class="le">
        <h2>🔗 Управление кнопками</h2>
        <label for="dl">🎮 Играть бесплатно (Демо)</label><input type="url" id="dl" placeholder="https://...">
        <label for="ml">💰 Играть на деньги</label><input type="url" id="ml" placeholder="https://...">
        <label for="bl">🎁 Получить бонус</label><input type="url" id="bl" placeholder="https://...">
        <div class="br"><button onclick="SL()">💾 Сохранить</button><button class="rst" onclick="RL()">↩️ Сбросить</button></div>
        <div class="ss" id="ss"></div>
    </div>
    <h2 class="st">📋 Последние 100 посетителей</h2>
    <div class="vt"><table><thead><tr><th>Дата/Время</th><th>Страна</th><th>Город</th><th>Устройство</th><th>Экран</th><th>Время (сек)</th><th>Источник</th></tr></thead><tbody id="tb"><tr class="er"><td colspan="7">Нет данных</td></tr></tbody></table></div>
</div>
<script>
const P='admin123';
addEventListener('DOMContentLoaded',()=>{if(localStorage.getItem('al')==='1')SA();document.getElementById('pi').addEventListener('keypress',e=>{if(e.key==='Enter')L()})});
function L(){if(document.getElementById('pi').value===P){localStorage.setItem('al','1');SA()}else{let e=document.getElementById('em');e.style.display='block';document.getElementById('pi').value='';setTimeout(()=>e.style.display='none',2500)}}
function SA(){document.getElementById('lf').style.display='none';document.getElementById('ap').style.display='block';US();LL();window.si=setInterval(US,30000)}
function O(){localStorage.removeItem('al');clearInterval(window.si);document.getElementById('lf').style.display='flex';document.getElementById('ap').style.display='none';document.getElementById('pi').value=''}
function US(){let v=JSON.parse(localStorage.getItem('sv')||'[]');document.getElementById('tv').textContent=v.length;let td=new Date().toISOString().split('T')[0];document.getElementById('tdv').textContent=v.filter(x=>x.t.startsWith(td)).length;let wt=v.filter(x=>x.ts&&x.ts>0);document.getElementById('at').textContent=(wt.length?Math.round(wt.reduce((s,x)=>s+x.ts,0)/wt.length):0)+' сек';document.getElementById('uc').textContent=new Set(v.map(x=>x.geo?.c).filter(Boolean)).size;let m=v.filter(x=>/Mobi|Android/i.test(x.ua||'')).length,t=v.length||1;document.getElementById('mp').textContent=Math.round(m/t*100)+'%';document.getElementById('dp').textContent=Math.round((t-m)/t*100)+'%';let rv=[...v].reverse().slice(0,100);document.getElementById('tb').innerHTML=rv.length?rv.map(x=>`<tr><td>${new Date(x.t).toLocaleString('ru-RU')}</td><td>${x.geo?.c||'—'}</td><td>${x.geo?.ci||'—'}</td><td>${D(x.ua)}</td><td>${x.sr||'—'}</td><td>${x.ts||0}</td><td>${x.ref==='direct'?'Прямой':(x.ref||'—')}</td></tr>`).join(''):'<tr class="er"><td colspan="7">Нет данных</td></tr>'}
function D(u){if(!u)return'—';if(/Mobi|Android/i.test(u))return'📱 Телефон';if(/Tablet|iPad/i.test(u))return'📲 Планшет';if(/TV/i.test(u))return'📺 ТВ';return'💻 ПК'}
function LL(){let l=JSON.parse(localStorage.getItem('bl')||'{}');document.getElementById('dl').value=l.demo||'https://example.com/play-demo';document.getElementById('ml').value=l.money||'https://example.com/play-money';document.getElementById('bl').value=l.bonus||'https://example.com/register-bonus'}
function SL(){let d=document.getElementById('dl').value.trim(),m=document.getElementById('ml').value.trim(),b=document.getElementById('bl').value.trim();if(!d||!m||!b){SS('⚠️ Заполните все поля!','#ff9800');return}localStorage.setItem('bl',JSON.stringify({demo:d,money:m,bonus:b}));SS('✅ Сохранено!','#4caf50')}
function RL(){if(!confirm('Сбросить ссылки?'))return;localStorage.setItem('bl',JSON.stringify({demo:'https://example.com/play-demo',money:'https://example.com/play-money',bonus:'https://example.com/register-bonus'}));LL();SS('↩️ Сброшено!','#4caf50')}
function SS(m,c){let e=document.getElementById('ss');e.textContent=m;e.style.color=c;setTimeout(()=>e.textContent='',3000)}
</script>
</body>
</html>
